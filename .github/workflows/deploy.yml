name: Deploy kraski.travel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on .121
        run: |
          set -e

          cd /srv/www/kraski.travel/kraski-travel

          git fetch origin
          git reset --hard origin/main
          git clean -fd

          docker rm -f kraski-travel 2>/dev/null || true

          for i in 1 2 3; do
            docker build --network=host -t kraski-travel . && break
            echo "Docker build failed, retry $i/3..."
            sleep 30
          done

          docker run -d --name kraski-travel \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file /etc/kraski-travel/kraski-travel.env \
            kraski-travel

          docker ps
